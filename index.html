<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Snack Zaz</title>
    <style>
        :root{--dark:rgba(0,0,0,.85);--dark2:#1a1a1a;--gold:#e10600;--green:#16a34a;--gf:#e10600;--grf:#16a34a;--bgc:#000;--ink:#fff;--card:rgba(0,0,0,.55);--bg:#000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Roboto,sans-serif}
        header{background:rgba(0,0,0,.55);color:#fff;border-bottom:4px solid var(--green);text-align:center;padding:16px 12px}
        header h1{margin:0;font-size:26px;letter-spacing:1px;cursor:pointer;user-select:none;}
        header small{display:block;font-weight:700;margin-top:4px}
        #heroWrap{padding:max(40px,calc(68vh - 210px)) 12px 0;transition:padding .5s ease}
        #heroWrap.compact{padding-top:12px}
        .heroBtn-map{background:linear-gradient(135deg,#4285F4,#34A853)}
        .heroBtn-back{background:#333;border:2px solid var(--gold)}
        .contact{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
        .contact a{background:var(--gf);color:#fff;padding:9px 14px;border-radius:20px;text-decoration:none;font-weight:800;font-size:14px}
        nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--dark);display:flex;overflow-x:auto;gap:6px;padding:8px;scrollbar-width:none}
        nav button{flex:none;background:transparent;color:#fff;border:1px solid var(--green);border-radius:18px;padding:7px 13px;font-weight:700}
        nav button.on{background:var(--gf);color:#fff}
        main{padding:12px 12px 90px;max-width:720px;margin:auto}
        h2{color:var(--gold);margin:18px 0 8px;border-bottom:2px solid var(--gold);padding-bottom:4px}
        .it{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 2px 8px #0006;border-left:4px solid var(--gold)}
        .it .e{width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.2);border-radius:50%;font-size:32px;flex:none;box-shadow:0 0 0 2px var(--gold);overflow:hidden}
        .it .e img{width:100%;height:100%;object-fit:cover;display:block}
        .it .n{flex:1;font-weight:600}
        .it .p{color:var(--green);font-weight:700;font-size:14px}
        .b{background:var(--gf);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;}
        .b:disabled{background:#999}
        .sz{display:flex;gap:6px}
        #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--dark);border-top:2px solid var(--gold);z-index:6}
        #bar button{width:100%;font-size:16px;padding:13px}
        input,select{width:100%;padding:10px;border-radius:9px;border:0;margin:4px 0;font-size:15px;background:#fff;color:#222}
        .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
        .q button{width:30px;height:30px;border-radius:8px;border:0;background:var(--grf);color:#fff;font-weight:800;cursor:pointer;}
        .q span{display:inline-block;min-width:26px;text-align:center}
        .tot{border-top:1px solid var(--gold);margin-top:8px;padding-top:8px}
        .hide{display:none!important}
        header h1{text-shadow:0 2px 6px #0007}
        .admin-box{background:rgba(0,0,0,0.85); padding:12px; margin-top:12px; border-radius:10px; border:1px solid var(--gold); text-align:right;}
            #toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#000;color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:12px;z-index:50;font-weight:700;max-width:90%;text-align:center}
        #pinBox{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
        #pinBox>div{background:var(--dark);border:2px solid var(--gold);border-radius:14px;padding:16px;width:100%;max-width:320px;text-align:center}
    </style>

<!-- إضافة: الألوان (أسود/رمادي/ذهبي) + الخلفية + الصور الجانبية -->
<style>
body{background:var(--bgc);color:#fff;min-height:100vh}
#bgfx{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:-1;pointer-events:none}
header,nav,#bar,.it,.it .e,.it .p,.b,.q button,h2,.contact a,nav button,.tot,.admin-box{transition:background-color 1.2s ease,border-color 1.2s ease,color 1.2s ease,box-shadow 1.2s ease}
h2{color:#fff;border-bottom-color:var(--green);text-shadow:0 1px 8px rgba(0,0,0,.6)}
.it{color:#fff}
.tot{border-top-color:var(--green)}
.b,.q button{border:2px solid rgba(255,255,255,.85)}
input,select{background:#e6e6e6;color:#111}
header{position:relative;z-index:2}
.side{display:none;position:fixed;top:calc(50% - 35px);transform:translateY(-50%);width:clamp(150px,14vw,230px);flex-direction:column;gap:14px;z-index:0}
.side.l{right:calc(50% + 376px)}
.side.r{left:calc(50% + 376px)}
.side img,.strip img{display:block;border:3px solid var(--gold);border-radius:16px;box-shadow:0 0 0 2px var(--green),0 6px 18px rgba(0,0,0,.35);background:#fff;object-fit:cover}
.side img{width:100%;max-height:30vh}
.strip{display:flex;gap:8px;max-width:720px;margin:0 auto;padding:10px 12px 0}
.strip img{flex:1;min-width:0;height:96px;border-radius:12px;border-width:2px}
@media(min-width:1100px){.side{display:flex}.strip{display:none}}
.xbtn{width:100%;background:#3a3a3a;color:#fff;margin:6px 0 10px}
.delbtn{width:100%;background:#000;color:#fff;border-color:var(--gold)}
#searchBar{position:relative;max-width:720px;margin:10px auto 0;padding:0 12px}
#searchBar input{width:100%;padding:12px 42px 12px 14px;border-radius:12px;border:2px solid var(--green);margin:0;font-size:16px;background:#e6e6e6;color:#111;-webkit-appearance:none;appearance:none}
#searchBar input::-webkit-search-cancel-button{display:none}
#searchClear{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:50%;background:#555;color:#fff;font-size:13px;cursor:pointer;padding:0}
.nores{text-align:center;opacity:.8;padding:24px 0}
.it{flex-wrap:wrap;cursor:default;transition:background-color 1.2s ease,border-color 1.2s ease,color 1.2s ease,box-shadow .35s ease,transform .35s ease}
.it .d{flex:0 0 100%;max-height:0;opacity:0;overflow:hidden;margin-top:-10px;transform:translateY(-6px);transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .4s ease,margin-top .4s ease,transform .4s ease}
.it .di{border-top:1px dashed rgba(255,255,255,.35);padding-top:8px;font-size:14px;line-height:1.5}
.it .dl{font-weight:800;opacity:.85;margin-bottom:2px}
.it .dp{margin-top:6px;font-weight:800;color:var(--green)}
.it.open .d{max-height:220px;opacity:1;margin-top:0;transform:none}
.it.open{box-shadow:0 8px 22px rgba(0,0,0,.5)}
@media(hover:hover){.it:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.5)}.it:hover .d{max-height:220px;opacity:1;margin-top:0;transform:none}}
/* تأثير الجذب المغناطيسي للأزرار */
.b,.q button,nav button,.contact a,#bar button,.heroBtn{translate:var(--mx,0px) var(--my,0px);transition:background-color 1.2s ease,border-color 1.2s ease,color 1.2s ease,box-shadow 1.2s ease,translate .35s cubic-bezier(.22,1,.36,1),transform .25s ease}
.contact a{display:inline-block}

/* أزرار: المينو + واتساب + انستغرام */
.heroBtns{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;width:100%;max-width:720px;margin:12px auto 0;text-align:center}
.heroBtn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:22px;font-weight:800;font-size:14px;text-decoration:none;border:0;cursor:pointer;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.heroBtn-menu{background:linear-gradient(135deg,var(--gold),#ff8a00)}
.heroBtn-wa{background:#25D366}
.heroBtn-ig{background:linear-gradient(135deg,#feda75,#d62976,#4f5bd5)}
.heroBtn svg{flex:none;display:block}

/* تكبير أي زر عند اقتراب/مرور الماوس عليه */
@media(hover:hover){
  .b:hover,.q button:hover,nav button:hover,.contact a:hover,#bar button:hover,.heroBtn:hover{
    transform:scale(1.12);
    box-shadow:0 6px 18px rgba(0,0,0,.45);
    z-index:3;
    position:relative;
  }
}
</style>
</head>
<body class="poster">
<style>
/* ===== POSTER START SCREEN: only the Snack Zaz image until "Voir le menu" is pressed ===== */
#posterBg{display:none;position:fixed;left:0;right:0;bottom:0;top:var(--hh,0px);z-index:-1;overflow:hidden;background:#000;pointer-events:none}
#posterBg .pb-main{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0%}
#posterBg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(to top,rgba(0,0,0,.72),transparent)}
@media (max-aspect-ratio:1/1){#posterBg .pb-main{object-position:50% 50%}}
@media (max-aspect-ratio:1/1){body.poster #heroWrap{padding-top:max(40px,calc(100vh - var(--hh,0px) - 165px))}body.poster .heroBtn{padding:9px 12px;font-size:13px}body.poster .heroBtns,body.poster #heroWrap>div:first-child{gap:7px!important}}
@media (min-aspect-ratio:1/1){body.poster #heroWrap{padding-top:max(40px,calc(100vh - var(--hh,0px) - 175px))}}
body.poster #posterBg{display:block}
body.poster #bgfx,body.poster #henBg,body.poster .side,body.poster .strip{display:none!important}
body.poster{background:#000}
/* hero buttons: colors matched to the poster (red / yellow / white) */
.heroBtn{border:2px solid #fff!important;padding:12px 20px;font-size:15px;letter-spacing:.2px;box-shadow:0 5px 16px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.heroBtn-menu{background:linear-gradient(180deg,#ffe44d,#ffb300)!important;color:#1b1b1b!important;border-color:#c40000!important}
.heroBtn-map{background:linear-gradient(180deg,#ff4a3d,#c40000)!important;color:#fff!important}
.heroBtn-wa{background:linear-gradient(180deg,#34e07f,#0f8a47)!important;color:#fff!important}
.heroBtn-ig{background:linear-gradient(45deg,#f9a825,#e1306c 55%,#7b3fbf)!important;color:#fff!important}
.heroBtn-fb{background:linear-gradient(180deg,#3b82f6,#1450c8)!important;color:#fff!important}
.heroBtn-back{background:#1f1f1f!important;color:#ffd400!important;border-color:#ffd400!important}
</style>
<script>(function(){function f(){var h=document.querySelector('header');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')}addEventListener('resize',f);addEventListener('load',f);document.addEventListener('DOMContentLoaded',f);setTimeout(f,300)})();</script>

// اختيار الصورة المناسبة لكل طبق (إن لم توجد صورة يُستعمل الإيموجي)
function imgFor(cat, name) {
    const n = (name || "").toLowerCase();
    switch (cat) {
        case "TACOS":
            if (/box/.test(n)) return IMG.box;
            if (/wrap/.test(n)) return IMG.wrap;
            if (/xl|gega/.test(n)) return IMG.tacosxl;
            if (/torittos|toritos/.test(n)) return IMG.toritos;
            if (/crispy/.test(n)) return IMG.crispy;
            return IMG.tacos;
        case "PANINI": return IMG.panini;
        case "CHAWARMA": return IMG.chawarma;
        case "BURGER": return IMG.burger;
        case "PIZZA": return IMG.pizza;
        case "SALADES": return IMG.salades;
        case "PLATS": return IMG.plats;
        case "PASTICCIO": return IMG.pasticcio;
        case "PÂTES": return IMG.pates;
        case "SUPPLÉMENTS": return /nugget/.test(n) ? IMG.crispy : IMG.supp;
        case "BOISSONS": return IMG.boissons;
        case "DESSERT": return IMG.tiramisu;
        default: return null;
    }
}

const CLOUD_URL="https://snack-zazz-default-rtdb.europe-west1.firebasedatabase.app";
function store(v){try{localStorage.setItem("yassinos_custom_menu_v3",JSON.stringify(v));}catch(e){}
try{fetch(CLOUD_URL+"/menu.json",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(JSON.stringify(v))}).then(r=>{if(!r.ok)throw 0;}).catch(()=>{try{toast("تعذر الحفظ على السحابة، تحقق من الإنترنت");}catch(e){}});}catch(e){}}
let savedMenu=null;try{savedMenu=localStorage.getItem("yassinos_custom_menu_v3");}catch(e){}
let M = savedMenu ? JSON.parse(savedMenu) : defaultMenu;

let currentCategory = Object.keys(M)[0];
let cart = [];

const SECRET_PIN = "8564";
let clickCount = 0;
let clickTimer = null;

function handleTitleClick() {
    clickCount++;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => { clickCount = 0; }, 2000);

    if (clickCount >= 5) {
        clickCount = 0;
        document.getElementById("pinInput").value = "";
        document.getElementById("pinBox").classList.remove("hide");
        document.getElementById("pinInput").focus();
    }
}

function closePin() { document.getElementById("pinBox").classList.add("hide"); }
function checkPin() {
    const pin = document.getElementById("pinInput").value;
    closePin();
    if (pin === SECRET_PIN) { toast("تم التحقق بنجاح!"); togglePriceEditor(); window.scrollTo(0, 0); }
    else { toast("الرمز السري غير صحيح!"); }
}

function togglePriceEditor() {
    const panel = document.getElementById("priceEditorPanel");
    panel.classList.toggle("hide");
    if (!panel.classList.contains("hide")) {
        populateItemSelect();
        populateCategorySelect();
        buildBulkEditor();
    }
}

function buildBulkEditor(){
    const box=document.getElementById("bulkList");
    if(!box)return;
    box.innerHTML="";
    for(const c in M){
        const h=document.createElement("div");
        h.textContent=c;
        h.style.cssText="color:var(--gold);font-weight:bold;margin:12px 0 4px;border-bottom:1px solid rgba(255,255,255,.2)";
        box.appendChild(h);
        M[c].forEach((it,i)=>{
            const row=document.createElement("div");
            row.style.cssText="display:flex;align-items:center;gap:6px;margin:4px 0";
            const n=document.createElement("span");
            n.textContent=it[0];
            n.style.cssText="flex:1;font-size:13px;direction:ltr;text-align:left";
            row.appendChild(n);
            const prices=Array.isArray(it[1])?it[1]:[it[1]];
            prices.forEach((pr,k)=>{
                const inp=document.createElement("input");
                inp.type="number";inp.value=pr;
                inp.dataset.c=c;inp.dataset.i=i;inp.dataset.k=k;
                inp.className="bulkPrice";
                inp.style.cssText="width:70px;margin:0;text-align:center";
                row.appendChild(inp);
            });
            box.appendChild(row);
        });
    }
}

function saveAllPrices(){
    let n=0;
    document.querySelectorAll("#bulkList .bulkPrice").forEach(inp=>{
        const v=parseFloat(inp.value);
        if(isNaN(v))return;
        const c=inp.dataset.c,i=+inp.dataset.i,k=+inp.dataset.k;
        if(!M[c]||!M[c][i])return;
        if(Array.isArray(M[c][i][1])){ if(M[c][i][1][k]!==v){M[c][i][1][k]=v;n++;} }
        else if(M[c][i][1]!==v){M[c][i][1]=v;n++;}
    });
    store(M);
    renderMain();
    try{populateItemSelect();}catch(e){}
    toast(n?("تم حفظ "+n+" تعديل بنجاح!"):"لا توجد تعديلات جديدة");
}

function populateItemSelect() {
    const select = document.getElementById("itemSelect");
    select.innerHTML = "";
    for (let cat in M) {
        M[cat].forEach((item, index) => {
            let opt = document.createElement("option");
            opt.value = `${cat}___${index}`;
            let priceText = Array.isArray(item[1]) ? item[1].join('/') : item[1];
            opt.textContent = `[${cat}] ${item[0]} (${priceText} دج)`;
            select.appendChild(opt);
        });
    }
}

function populateCategorySelect() {
    const select = document.getElementById("newCategorySelect");
    select.innerHTML = "";
    for (let cat in M) {
        let opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = `${E[cat] || '🍽️'} ${cat}`;
        select.appendChild(opt);
    }
}

function fillIng() {
    const v = document.getElementById("itemSelect").value, inp = document.getElementById("itemNewIng");
    if (!v || !inp) return;
    const [c, i] = v.split("___");
    inp.value = (M[c] && M[c][+i] && M[c][+i][2]) || "";
}

function saveNewPrice() {
    const val = document.getElementById("itemSelect").value;
    const newPriceVal = parseFloat(document.getElementById("itemNewPrice").value);
    const ing = document.getElementById("itemNewIng").value.trim();

    if (!val || (isNaN(newPriceVal) && !ing)) {
        toast("الرجاء اختيار المنتج وإدخال سعر أو مكونات.");
        return;
    }

    let [cat, index] = val.split("___");
    index = parseInt(index);

    if (!isNaN(newPriceVal)) {
        if (Array.isArray(M[cat][index][1])) M[cat][index][1][0] = newPriceVal;
        else M[cat][index][1] = newPriceVal;
    }
    if (ing) M[cat][index][2] = ing;

    store(M);
    toast("تم التحديث بنجاح!");
    document.getElementById("itemNewPrice").value = "";
    togglePriceEditor();
    renderMain();
}

// دالة إضافة طبق جديد للقائمة
function addNewDish() {
    const cat = document.getElementById("newCategorySelect").value;
    const name = document.getElementById("newDishName").value.trim();
    const price = parseFloat(document.getElementById("newDishPrice").value);

    if (!name || isNaN(price)) {
        toast("الرجاء إدخال اسم الطبق وثمنه بشكل صحيح.");
        return;
    }

    // إضافة الطبق الجديد للمصفوفة الخاصة بالقسم
    const newIng = document.getElementById("newDishIng").value.trim();
    M[cat].push(newIng ? [name, price, newIng] : [name, price]);

    // الحفظ في التخزين المحلي
    store(M);
    
    toast(`تمت إضافة "${name}" إلى قسم ${cat} بنجاح!`);
    
    // تفريغ الحقول وإغلاق اللوحة وتحديث العرض
    document.getElementById("newDishName").value = "";
    document.getElementById("newDishPrice").value = "";
    document.getElementById("newDishIng").value = "";
    togglePriceEditor();
    
    // الانتقال تلقائياً للقسم الذي أضفت إليه الطبق لترسيه فوراً
    currentCategory = cat;
    clearSearch(false);
    renderNav();
    renderMain();
}

function renderNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = '';
    Object.keys(M).forEach(k => {
        let btn = document.createElement('button');
        btn.textContent = (E[k] || '🍽️') + ' ' + k;
        if (k === currentCategory && !norm(searchQ)) btn.className = 'on';
        btn.onclick = () => {
            currentCategory = k;
            clearSearch(false);
            renderNav();
            renderMain();
        };
        nav.appendChild(btn);
    });
}

let searchQ = "";
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}

// ===== وصف المكونات (افتراضي - يمكن تعديله من لوحة التحكم) =====
function proteinOf(n) {
    if (/fruits de mer/.test(n)) return "fruits de mer";
    if (/cordon bleu/.test(n)) return "cordon bleu";
    if (/mexicain/.test(n)) return "poulet, poivrons et sauce mexicaine";
    if (/mixte/.test(n)) return "poulet et viande hachée";
    if (/crispy/.test(n)) return "poulet crispy";
    if (/nugget/.test(n)) return "nuggets de poulet";
    if (/chawarma/.test(n)) return "chawarma";
    if (/poulet/.test(n)) return "poulet mariné";
    if (/viande|hach|bolognaise/.test(n)) return "viande hachée";
    if (/jambon/.test(n)) return "jambon";
    if (/thon/.test(n)) return "thon";
    if (/pepperoni/.test(n)) return "pepperoni";
    if (/charcuterie/.test(n)) return "charcuterie";
    return "";
}
function ingFor(cat, name) {
    const n = norm(name), p = proteinOf(n);
    const withP = (base) => p ? base + ", " + p : base;
    switch (cat) {
        case "TACOS":
            if (/wrap/.test(n)) return withP("Galette tortilla, frites, sauce fromagère, crudités");
            if (/box/.test(n)) return withP("Frites, sauce fromagère, fromage fondu");
            if (/gratin/.test(n)) return withP("Galette tortilla, frites, sauce fromagère, fromage gratiné");
            return withP("Galette tortilla, frites, sauce fromagère");
        case "PANINI": return withP("Pain panini grillé, fromage fondu, sauce") ;
        case "CHAWARMA":
            if (/double/.test(n)) return "Pain, chawarma, double fromage, sauce, salade";
            if (/fromage/.test(n)) return "Pain, chawarma, fromage, frites, sauce";
            return "Pain, chawarma, sauce, salade";
        case "BURGER": {
            const meat = /chicken/.test(n) ? "poulet pané" : "steak haché";
            return "Pain burger, " + meat + (/double/.test(n) ? " (x2)" : "") + ", fromage, salade, tomate, sauce";
        }
        case "PIZZA":
            if (/margarita/.test(n)) return "Pâte maison, sauce tomate, mozzarella, olives";
            if (/vegetarienne/.test(n)) return "Pâte maison, sauce tomate, mozzarella, légumes grillés, olives";
            if (/4 saisons/.test(n)) return "Pâte maison, sauce tomate, mozzarella, poulet, viande hachée, champignons, poivrons";
            return withP("Pâte maison, sauce tomate, mozzarella") + ", olives";
        case "SALADES":
            if (/chef/.test(n)) return "Laitue, tomate, concombre, maïs, olives, thon";
            if (/riche/.test(n)) return "Laitue, tomate, concombre, maïs, olives, œuf, thon, fromage";
            return withP("Laitue, tomate, concombre, maïs, olives");
        case "PLATS": return withP("Servi avec frites, salade et sauce");
        case "PASTICCIO": return withP("Pâtes gratinées, béchamel, fromage");
        case "PÂTES": return withP("Pâtes, sauce crème");
        case "SUPPLÉMENTS":
            if (/frites/.test(n)) return "Pommes de terre fraîches, croustillantes";
            if (/fromage/.test(n)) return "Fromage fondu en supplément";
            if (/nugget/.test(n)) return "Morceaux de poulet panés, dorés";
            if (/mozza/.test(n)) return "Bâtonnets de mozzarella panés, fondants";
            return "";
        case "BOISSONS":
            if (/citron/.test(n)) return "Citron pressé frais";
            if (/orange/.test(n)) return "Oranges pressées fraîches";
            if (/avocat/.test(n)) return "Avocat, lait, sucre";
            if (/panach/.test(n)) return "Mélange de jus de fruits frais";
            if (/soda/.test(n)) return "Boisson gazeuse 1 litre";
            return "Boisson fraîche";
        case "DESSERT": return /tiramisu/.test(n) ? "Mascarpone, biscuits, café, cacao" : "";
        default: return "";
    }
}

function itemEl(cat, item, i) {
    let div = document.createElement('div');
    div.className = 'it';
    let name = item[0], price = item[1];
    let pHTML = '';
    if (Array.isArray(price)) {
        pHTML = `<div class="sz"><button class="b" onclick="addToCart('${cat}', ${i}, 0)">Petit: ${price[0]}dh</button><button class="b" onclick="addToCart('${cat}', ${i}, 1)">Grand: ${price[1]}dh</button></div>`;
    } else {
        pHTML = `<div class="p">${price} DH</div><button class="b" onclick="addToCart('${cat}', ${i})">+</button>`;
    }
    const src = (cat === 'TACOS') ? MEX_IMG : null; // صورة الطاموس بدل الإيموجي لكل أطباق التاكوس
    const visual = src ? `<img src="${src}" alt="${escHtml(name)}" loading="lazy" decoding="async">` : (E[cat] || '🍽️');
    const ing = item[2] || ingFor(cat, name);
    const priceTxt = Array.isArray(price) ? `Petit ${price[0]} DH · Grand ${price[1]} DH` : `${price} DH`;
    const det = `<div class="d"><div class="di">${ing ? `<div class="dl">🧾 المكونات · Ingrédients</div><div>${escHtml(ing)}</div>` : ''}<div class="dp">💰 السعر · Prix : ${priceTxt}</div></div></div>`;
    div.innerHTML = `<div class="e">${visual}</div><div class="n">${escHtml(name)}</div>${pHTML}${det}`;
    // على اللمس (بدون ماوس): الضغط على البطاقة يفتح/يغلق التفاصيل
    div.addEventListener('click', ev => {
        if (ev.target.closest('button')) return;
        if (window.matchMedia('(hover:none)').matches) div.classList.toggle('open');
    });
    return div;
}

function renderMain() {
    const main = document.getElementById('main');
    const words = norm(searchQ).split(/\s+/).filter(Boolean);

    if (words.length) {
        main.innerHTML = `<h2>🔍 ${escHtml(searchQ.trim())}</h2>`;
        let found = 0;
        for (const cat in M) {
            const hits = [];
            M[cat].forEach((item, i) => {
                const n = norm(item[0]);
                if (words.every(w => n.includes(w))) hits.push([item, i]);
            });
            if (!hits.length) continue;
            found += hits.length;
            const h = document.createElement('div');
            h.style.cssText = 'margin:12px 0 6px;font-weight:800;opacity:.85';
            h.textContent = (E[cat] || '🍽️') + ' ' + cat;
            main.appendChild(h);
            hits.forEach(([item, i]) => main.appendChild(itemEl(cat, item, i)));
        }
        if (!found) main.insertAdjacentHTML('beforeend', '<p class="nores">😕 لا توجد نتائج · Aucun résultat</p>');
        return;
    }

    main.innerHTML = `<h2>${(E[currentCategory] || '🍽️')} ${currentCategory}</h2>`;
    if (!M[currentCategory]) return;
    M[currentCategory].forEach((item, i) => main.appendChild(itemEl(currentCategory, item, i)));
}

function onSearch(v) {
    searchQ = v || "";
    document.getElementById('searchClear').classList.toggle('hide', !searchQ);
    renderNav();
    renderMain();
}
function clearSearch(rerender) {
    searchQ = "";
    const inp = document.getElementById('searchInput');
    if (inp) inp.value = "";
    document.getElementById('searchClear').classList.add('hide');
    if (rerender) { renderNav(); renderMain(); }
}

function addToCart(cat, idx, sizeIdx) {
    let item = M[cat][idx];
    let name = item[0], price = item[1];
    let sizeName = '', finalPrice = price;
    
    if (Array.isArray(price)) {
        finalPrice = price[sizeIdx];
        sizeName = (sizeIdx === 0 ? ' (Petit)' : ' (Grand)');
    }
    
    let found = cart.find(c => c.cat === cat && c.idx === idx && c.sizeIdx === sizeIdx);
    if (found) {
        found.qty++;
    } else {
        cart.push({ cat, idx, sizeIdx, name: name + sizeName, price: finalPrice, qty: 1 });
    }
    updateBar();
}

let TABLE_ERR='';
const TABLE=(function(){
  let raw='';
  try{
    const keys=['table','tbl','t','tab','tableno','tablenumber','table_number','table_no','desk','num'];
    const grab=sp=>{for(const [k,v] of sp.entries()){if(keys.indexOf(k.toLowerCase())>-1&&String(v).trim())return String(v).trim();}return '';};
    raw=grab(new URLSearchParams(location.search));
    if(!raw&&location.hash)raw=grab(new URLSearchParams(location.hash.replace(/^#\/?\??/,'')));
    if(!raw){const pm=location.pathname.match(/table[\/_-]?(-?[A-Za-z0-9.]+)/i);if(pm)raw=pm[1];}
    if(!raw&&/^#-?\d{1,6}$/.test(location.hash))raw=location.hash.slice(1);
  }catch(e){}
  const check=v=>{
    if(/^\d+$/.test(v)){const n=parseInt(v,10);if(n>=1&&n<=10)return {ok:String(n)};if(n>10)return {err:'MAX'};return {err:'MIN'};}
    if(/^-?\d+(\.\d+)?$/.test(v)){const n=parseFloat(v);if(n>10)return {err:'MAX'};return {err:'MIN'};}
    return {err:'MIN'};
  };
  let t='';
  if(raw){
    const r=check(raw);
    if(r.ok){t=r.ok;try{sessionStorage.setItem('yz_table',t);}catch(e){}}
    else{TABLE_ERR=r.err;try{sessionStorage.removeItem('yz_table');}catch(e){}}
  }else{
    try{sessionStorage.removeItem('yz_table');}catch(e){}
  }
  return t;
})();
function tableErrText(){
  return TABLE_ERR==='MAX' ? 'لا يوجد هذا العدد من الطاولات' : TABLE_ERR==='MIN' ? 'لا توجد هذه الطاولة' : '';
}
(function showTableErr(){
  const msg=tableErrText();if(!msg)return;
  const d=document.createElement('div');
  d.id='tableErrBlock';
  d.style.cssText='position:fixed;inset:0;z-index:2147483647;background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:inherit';
  d.innerHTML='<div style="font-size:64px;margin-bottom:16px">⚠️</div><div style="font-size:26px;font-weight:800;color:#ff5252;line-height:1.6">'+msg+'</div><div style="margin-top:14px;font-size:16px;opacity:.8">الرجاء مسح رمز QR الموجود على طاولتك</div>';
  document.body.appendChild(d);
  document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden';
})();
let userLoc = null, locSrc = null, locDesc = '';
function escHtml(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hasLoc(){return !!(userLoc || locDesc.trim().length >= 3);}
function setLocDesc(v){locDesc=v;refreshLocStatus();}
function locStatusText(){return hasLoc() ? '✅ تم تسجيل موقعك' : 'الرجاء وصف مكانك أو تحديده على الخريطة';}
function refreshLocStatus(){const el=document.getElementById('locStatus');if(el)el.textContent=locStatusText();}
function getGPS(){
    if(!navigator.geolocation){toast("المتصفح لا يدعم GPS، استعمل رابط Google Maps");return;}
    const el=document.getElementById('locStatus');if(el)el.textContent='⏳ جارٍ تحديد موقعك...';
    navigator.geolocation.getCurrentPosition(p=>{
        userLoc=`https://www.google.com/maps?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;
        locSrc='gps';toast("تم تحديد موقعك ✅");openCart();
    },()=>{
        refreshLocStatus();toast("تعذّر تحديد الموقع. فعّل GPS وأذن للموقع أو الصق رابط Google Maps");
    },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function setLocLink(v){
    v=(v||'').trim();
    const coords=v.match(/^(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/);
    if(coords){userLoc=`https://www.google.com/maps?q=${coords[1]},${coords[2]}`;locSrc='link';}
    else if(/^https?:\/\/(www\.)?(maps\.app\.goo\.gl|goo\.gl\/maps|google\.[a-z.]+\/maps|maps\.google\.[a-z.]+)/i.test(v)){userLoc=v;locSrc='link';}
    else{userLoc=null;locSrc=null;}
    refreshLocStatus();
}

function openCart() {
    if (TABLE_ERR) return;
    let main = document.getElementById('main');
    let html = `<h2>🛒 Mon Panier</h2>`;
    if (cart.length === 0) {
        html += `<p>Le panier est vide.</p>`;
    } else {
        cart.forEach((c, i) => {
            html += `<div class="row"><span>${c.name} - ${c.price} DH</span><div class="q"><button onclick="changeQty(${i}, -1)">-</button><span>${c.qty}</span><button onclick="changeQty(${i}, 1)">+</button></div></div>`;
        });
        let tot = cart.reduce((s, c) => s + c.price * c.qty, 0);
        html += `<div class="row tot"><b>Total:</b> <b>${tot} DH</b></div>`;
        if (TABLE_ERR) { html += `<div style="background:#c62828;color:#fff;border-radius:12px;padding:14px;margin-top:14px;text-align:center;font-size:18px;font-weight:800">⚠️ ${tableErrText()}</div>`; }
        if (TABLE) { html += `<div style="background:rgba(0,0,0,.55);border:2px solid var(--green);border-radius:12px;padding:14px;margin-top:14px;text-align:center;font-size:20px;font-weight:800">🪑 طاولة رقم · Table ${escHtml(TABLE)}</div>`; }
        if (!TABLE) {
        html += `<div style="background:rgba(0,0,0,.55);border:1px solid var(--green);border-radius:12px;padding:12px;margin-top:14px">
            <b>📍 موقعك · Votre position</b>
            <textarea id="locDesc" rows="3" placeholder="صف لنا مكانك: المدينة، الحي، الشارع، أقرب معلمة، رقم الباب..." oninput="setLocDesc(this.value)" style="width:100%;margin-top:8px;padding:10px;border-radius:9px;border:0;font-size:15px;background:#e6e6e6;color:#111;font-family:inherit;resize:vertical">${escHtml(locDesc)}</textarea>
            <div style="text-align:center;margin:8px 0;opacity:.8">— أو يمكنك أيضاً / ou aussi —</div>
            <button class="b" style="width:100%" onclick="getGPS()">📡 تحديد موقعي تلقائياً</button>
            <div style="height:6px"></div>
            <button class="b" style="width:100%;background:var(--grf)" onclick="window.open('https://www.google.com/maps','_blank')">🗺️ فتح Google Maps</button>
            <input id="locInput" type="text" dir="ltr" placeholder="أو الصق رابط موقعك من Google Maps" value="${locSrc==='link'?userLoc:''}" oninput="setLocLink(this.value)">
            <div id="locStatus" style="font-weight:700;margin-top:4px">${locStatusText()}</div>
        </div>`;
        }
        html += `<button class="b" style="width:100%;margin-top:15px;" onclick="sendWA()">Envoyer sur WhatsApp 💬</button>`;
    }
    main.innerHTML = html;
}

function changeQty(i, d) {
    cart[i].qty += d;
    if (cart[i].qty <= 0) cart.splice(i, 1);
    openCart();
    updateBar();
}

function updateBar() {
    let totalQty = cart.reduce((s, c) => s + c.qty, 0);
    let totalPrice = cart.reduce((s, c) => s + c.price * c.qty, 0);
    let btn = document.getElementById('cartBtn');
    btn.textContent = totalQty > 0 ? `🛒 Panier (${totalQty} articles) - ${totalPrice} DH` : `🛒 Voir le panier`;
}

function sendWA() {
    if (TABLE_ERR) { toast(tableErrText()); return; }
    if (!TABLE && !hasLoc()) { toast("الرجاء وصف مكانك أو تحديده على الخريطة"); const el=document.getElementById('locDesc'); if(el) el.focus(); return; }
    let txt = "Bonjour, je souhaite commander:%0A";
    cart.forEach(c => { txt += `- ${c.qty}x ${c.name} (${c.price * c.qty} DH)%0A`; });
    let tot = cart.reduce((s, c) => s + c.price * c.qty, 0);
    txt += `%0ATotal: ${tot} DH`;
    if (TABLE) txt = `🪑 TABLE N° ${encodeURIComponent(TABLE)}%0A%0A` + txt;
    if (locDesc.trim()) txt += `%0A%0A📍 Adresse: ${encodeURIComponent(locDesc.trim())}`;
    if (userLoc) txt += `%0A🗺️ Position: ${encodeURIComponent(userLoc)}`;
    window.open(`https://wa.me/${WA}?text=${txt}`, '_blank');
}

renderNav();
renderMain();

<script>
/* خلفية النار السينمائية: أسود → برتقالي → أحمر مائل للبرتقالي، تتغير كل 10 ثوانٍ.
   النار تخرج من الأطراف الأربعة وتلتهم اللون القديم بالكامل وتترك اللون الجديد فقط. */
(function(){
  var PAL=[
    {css:'#000',    rgb:[0.043,0.020,0.016]},
    {css:'#ff7a00', rgb:[1.000,0.478,0.000]},
    {css:'#ff3d00', rgb:[1.000,0.239,0.000]}
  ];
  var CYCLE=10000,   // كل 10 ثوانٍ تنفجر النار وتتغير الألوان
      BURN=5600,     // مدة انتشار النار حتى تلتهم الشاشة
      AFTER=2600,    // مدة خمود الجمر بعد ذلك
      START=1500;    // تأخير أول اشتعال
  var R=document.documentElement.style, accIdx=-1;
  function safe(c){return c==='#000'?'#fff':c}
  function setAccents(i){
    accIdx=i;
    var c1=PAL[(i+1)%3].css,c2=PAL[(i+2)%3].css;
    R.setProperty('--gf',c1);R.setProperty('--grf',c2);
    R.setProperty('--gold',safe(c1));R.setProperty('--green',safe(c2));
    R.setProperty('--bgc',PAL[i].css);
  }
  setAccents(0);

  /* بديل بسيط (بدون WebGL أو عند تفعيل تقليل الحركة): تبديل ناعم للألوان */
  function fallback(cv){
    if(cv&&cv.parentNode)cv.parentNode.removeChild(cv);
    var d=document.createElement('div');d.id='bgfx';
    d.style.backgroundColor=PAL[0].css;d.style.transition='background-color 2.5s ease';
    document.body.prepend(d);
    var k=0;
    (function tick(){setTimeout(function(){k++;var i=k%3;d.style.backgroundColor=PAL[i].css;setTimeout(function(){setAccents(i)},1200);tick()},k===0?START:CYCLE)})();

<script>
// أزرار مغناطيسية: تنجذب قليلاً نحو الماوس عند اقترابه (على الأجهزة التي فيها ماوس فقط)
(function(){
  if(!window.matchMedia||!matchMedia('(hover:hover) and (pointer:fine)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var SEL='.b,.q button,nav button,.contact a,#bar button,.heroBtn',RANGE=90,PULL=.35,mx=-9999,my=-9999,raf=0;
  function clamp(v,m){return Math.max(-m,Math.min(m,v))}
  function frame(){
    raf=0;
    document.querySelectorAll(SEL).forEach(function(el){
      var ox=el._mx||0,oy=el._my||0,r=el.getBoundingClientRect(),tx=0,ty=0;
      if(r.width&&!el.disabled){
        // المربع الأصلي بدون إزاحة الجذب (لتفادي الاهتزاز)
        var L=r.left-ox,T=r.top-oy,Rr=r.right-ox,B=r.bottom-oy;
        var dx=Math.max(L-mx,0,mx-Rr),dy=Math.max(T-my,0,my-B),d=Math.hypot(dx,dy);
        if(d<RANGE){
          var k=1-d/RANGE,cx=(L+Rr)/2,cy=(T+B)/2;
          tx=clamp((mx-cx)*PULL,Math.min(10,r.width*.15))*k;
          ty=clamp((my-cy)*PULL,Math.min(10,r.height*.25))*k;
        }
      }
      tx=Math.round(tx*10)/10;ty=Math.round(ty*10)/10;
      if(tx!==ox||ty!==oy){
        el._mx=tx;el._my=ty;
        el.style.setProperty('--mx',tx+'px');el.style.setProperty('--my',ty+'px');
      }
    });
  }
  function sched(){if(!raf)raf=requestAnimationFrame(frame)}
  document.addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;sched()},{passive:true});
  document.addEventListener('scroll',sched,{passive:true});
  document.addEventListener('mouseout',function(e){if(!e.relatedTarget){mx=my=-9999;sched()}});
  window.addEventListener('blur',function(){mx=my=-9999;sched()});
})();
</script>

#bar{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}

/* البوستر: إزاحة الصورة لأعلى قليلاً (30%) في الوضع العمودي حتى لا يُقصّ عنوان «شري دابا من» على الشاشات القصيرة */
@media (max-aspect-ratio:1/1){#posterBg .pb-main{object-position:50% 30%}}

/* ---------- لوحي / هاتف كبير ≤ 768px ---------- */
@media (max-width:768px){
  header h1{font-size:24px}
  h2{font-size:21px}
  input,select,textarea{font-size:16px} /* يمنع تكبير الصفحة تلقائياً في iPhone */
  .strip img{height:84px}
  .it .n{min-width:0;overflow-wrap:anywhere}
}

/* ---------- هواتف ≤ 480px ---------- */
@media (max-width:480px){
  /* الترويسة */
  header{padding-top:12px;padding-bottom:10px}
  header h1{font-size:22px;letter-spacing:.5px}
  header small{font-size:12px;margin-top:3px;line-height:1.4}
  .contact{gap:6px;margin-top:8px}
  .contact a{padding:8px 12px;font-size:13px}

  /* الصفحة الأولى (البوستر) والأزرار */
  .heroBtn,body.poster .heroBtn{padding:9px 12px;font-size:13px;gap:6px;border-width:2px}
  .heroBtn svg{width:17px;height:17px}
  .heroBtns{gap:7px;margin-top:8px}
  body.poster #heroWrap{
    padding-top:max(40px,calc(100vh - var(--hh,0px) - 175px));
    padding-top:max(40px,calc(100svh - var(--hh,0px) - 175px)); /* يتجنب مشكلة شريط المتصفح في الهاتف */
  }

  /* شريط الأصناف والبحث */
  nav{gap:5px;padding-top:6px;padding-bottom:6px}
  nav button{padding:6px 11px;font-size:13px}
  #searchBar{margin-top:8px;padding-left:10px;padding-right:10px}
  #searchBar input{padding:10px 38px 10px 12px}
  #searchClear{right:18px;width:26px;height:26px}

  /* المحتوى */
  main{padding-top:8px;padding-bottom:84px;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  h2{font-size:18px;margin:14px 0 6px}

  /* بطاقة الطبق */
  .it{gap:8px;padding:8px;margin-bottom:7px;border-radius:10px}
  .it .e{width:52px;height:52px;font-size:26px}
  .it .n{font-size:14.5px;line-height:1.3}
  .it .p{font-size:13px;white-space:nowrap}
  .b{padding:7px 10px;font-size:13px;border-radius:9px}
  /* طبق بحجمين (Petit / Grand): الزرّان في سطر كامل تحت الاسم */
  .it .sz{flex:0 0 100%;gap:6px}
  .it .sz .b{flex:1;padding:8px 6px}
  .it .d{margin-top:-8px}
  .it.open .d{max-height:320px}
  .it .di{font-size:13px}
  .it .dp{font-size:13px}

  /* السلة */
  .row{font-size:14px;gap:6px;padding:5px 0}
  .row>span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
  .q{flex:none;white-space:nowrap}
  .q button{width:34px;height:34px}
  .tot{margin-top:6px;padding-top:6px;font-size:15px}

  /* شريط السلة السفلي */
  #bar{padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  #bar button{font-size:15px;padding:12px}

  /* نوافذ ورسائل */
  #toast{font-size:13px;padding:8px 12px;max-width:calc(100% - 24px)}
  #pinBox{padding:14px}
  #pinBox>div{padding:14px}

  /* لوحة التحكم */
  .admin-box{padding:10px}
  #bulkList{max-height:45vh!important}
  #bulkList>div>span{min-width:0;overflow-wrap:anywhere}
  .bulkPrice{width:60px!important;padding:8px 4px}

  /* صور جانبية صغيرة */
  .strip{gap:6px;padding-top:8px}
  .strip img{height:72px}
}

/* ---------- هواتف صغيرة جداً ≤ 360px ---------- */
@media (max-width:360px){
  header h1{font-size:20px}
  header small{font-size:11px}
  .contact a{padding:7px 10px;font-size:12px}
  .heroBtn,body.poster .heroBtn{padding:8px 10px;font-size:12px}
  .heroBtn svg{width:15px;height:15px}
  nav button{padding:5px 9px;font-size:12px}
  h2{font-size:17px}
  .it{gap:6px;padding:7px}
  .it .e{width:46px;height:46px;font-size:23px}
  .it .n{font-size:14px}
  .b{padding:6px 8px;font-size:12px}
  .it .sz .b{padding:7px 4px}
  .row{font-size:13px}
  .bulkPrice{width:52px!important}
}

/* ---------- هاتف بالوضع الأفقي (ارتفاع قصير) ---------- */
@media (max-height:500px) and (orientation:landscape){
  header{padding-top:8px;padding-bottom:8px}
  header h1{font-size:20px}
  header small{font-size:12px;margin-top:2px}
  .contact{margin-top:6px}
  .contact a{padding:6px 12px;font-size:13px}
  .heroBtn,body.poster .heroBtn{padding:7px 12px;font-size:13px}
  body.poster #heroWrap{
    padding-top:max(16px,calc(100vh - var(--hh,0px) - 125px));
    padding-top:max(16px,calc(100svh - var(--hh,0px) - 125px));
  }
  nav{padding-top:5px;padding-bottom:5px}
  nav button{padding:5px 11px;font-size:13px}
  main{padding-bottom:72px}
  #bar{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  #bar button{padding:9px;font-size:14px}
  #pinBox{align-items:flex-start;overflow:auto}
  #bulkList{max-height:40vh!important}
}

/* ---------- البوستر قابل للتمرير على الهاتف (الوضع العمودي) ----------
   الصورة تأخذ ارتفاعها الكامل بنسبة 9:16 (أو تملأ الشاشة إن كانت أطول)،
   والأزرار تبقى في أسفلها، وتمرّر الصفحة لرؤية الصورة كاملة. */
@media (max-aspect-ratio:1/1) and (max-width:768px){
  body.poster{--ph:max(calc(100vw * 16 / 9),calc(100vh - var(--hh,0px)))}
  body.poster #posterBg{position:absolute;bottom:auto;height:var(--ph);top:calc(var(--hh,0px) + env(safe-area-inset-top,0px))}
  body.poster #heroWrap{padding-top:max(40px,calc(var(--ph) - 175px))}
}
@supports (height:100svh){
  @media (max-aspect-ratio:1/1) and (max-width:768px){
    body.poster{--ph:max(calc(100vw * 16 / 9),calc(100svh - var(--hh,0px)))}
  }
}
</style>
<!-- ===== /RESPONSIVE ===== -->

</body>
